<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gs-title gs-desc" width="100%" preserveAspectRatio="xMidYMid meet">
  <title id="gs-title">Goal versus System</title>
  <desc id="gs-desc">The goal is the destination; the system is the daily actions that move you there.</desc>
  <rect x="10" y="10" width="740" height="280" rx="18" fill="#fefdfb" stroke="#e7ddd0" stroke-width="1.5"/>
  <circle cx="80" cy="140" r="11" fill="#1c1a18"/>
  <text x="80" y="174" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6f655a">Where you</text>
  <text x="80" y="190" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6f655a">are now</text>
  <line x1="100" y1="140" x2="626" y2="140" stroke="#cbbda9" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 11"/>
  <rect x="172" y="132" width="16" height="16" rx="4" fill="#c9a227"/>
  <rect x="282" y="132" width="16" height="16" rx="4" fill="#c9a227"/>
  <rect x="392" y="132" width="16" height="16" rx="4" fill="#c9a227"/>
  <rect x="502" y="132" width="16" height="16" rx="4" fill="#c9a227"/>
  <line x1="164" y1="176" x2="164" y2="182" stroke="#cbbda9" stroke-width="1.5"/>
  <line x1="164" y1="182" x2="526" y2="182" stroke="#cbbda9" stroke-width="1.5"/>
  <line x1="526" y1="182" x2="526" y2="176" stroke="#cbbda9" stroke-width="1.5"/>
  <text x="345" y="204" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#a8851a">SYSTEM</text>
  <text x="345" y="223" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="13" fill="#8a7f6f">what you do daily</text>
  <text x="654" y="92" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#a8851a">what you want</text>
  <line x1="654" y1="104" x2="654" y2="150" stroke="#1c1a18" stroke-width="3" stroke-linecap="round"/>
  <path d="M655 106 L700 117 L655 128 Z" fill="#c9a227"/>
  <circle cx="654" cy="150" r="6" fill="#1c1a18"/>
  <text x="654" y="176" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1c1a18">GOAL</text>
  <text x="654" y="193" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="12" fill="#8a7f6f">the destination</text>
  <text x="380" y="258" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#1c1a18">The goal sets the direction. The system does the moving.</text>
  <text x="730" y="280" text-anchor="end" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="11" fill="#b8ad9d">smoothgoals.com</text>
</svg>
