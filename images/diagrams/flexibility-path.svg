<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fx-title fx-desc" width="100%" preserveAspectRatio="xMidYMid meet">
  <title id="fx-title">Flexibility: keep the goal fixed, let the path bend</title>
  <desc id="fx-desc">A rigid path runs straight and stops at the first obstacle. A flexible path bends around the obstacles and still reaches the same fixed goal.</desc>
  <rect x="10" y="10" width="740" height="280" rx="18" fill="#fefdfb" stroke="#e7ddd0" stroke-width="1.5"/>
  <rect x="311" y="133" width="18" height="34" rx="4" fill="#ddd2c2" stroke="#cbbda9" stroke-width="1"/>
  <rect x="491" y="133" width="18" height="34" rx="4" fill="#ddd2c2" stroke="#cbbda9" stroke-width="1"/>
  <text x="410" y="50" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#8a7f6f">SETBACKS ALONG THE WAY</text>
  <text x="300" y="78" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#a8851a">flexible path — arrives</text>
  <path d="M84,150 C 170,150 250,96 320,96 C 395,96 430,204 500,204 C 575,204 632,150 684,150" fill="none" stroke="#c9a227" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="84" y1="150" x2="300" y2="150" stroke="#b7ab9b" stroke-width="2.5" stroke-dasharray="6 5"/>
  <line x1="298" y1="144" x2="310" y2="156" stroke="#8a7f6f" stroke-width="2.5"/>
  <line x1="310" y1="144" x2="298" y2="156" stroke="#8a7f6f" stroke-width="2.5"/>
  <text x="180" y="176" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="12" fill="#8a7f6f">rigid path — stops at the first obstacle</text>
  <circle cx="72" cy="150" r="11" fill="#1c1a18"/>
  <text x="72" y="128" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#6f655a">Start</text>
  <line x1="690" y1="108" x2="690" y2="150" stroke="#1c1a18" stroke-width="3" stroke-linecap="round"/>
  <path d="M691 110 L732 120 L691 130 Z" fill="#c9a227"/>
  <circle cx="690" cy="150" r="6" fill="#1c1a18"/>
  <text x="690" y="176" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1c1a18">GOAL</text>
  <text x="690" y="193" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="12" fill="#8a7f6f">stays fixed</text>
  <text x="380" y="248" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#1c1a18">Keep the goal fixed. Let the path bend.</text>
  <text x="730" y="276" text-anchor="end" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="11" fill="#b8ad9d">smoothgoals.com</text>
</svg>
