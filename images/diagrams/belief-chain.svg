<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bc-title bc-desc" width="100%" preserveAspectRatio="xMidYMid meet">
  <title id="bc-title">How a limiting belief forms — and where it breaks</title>
  <desc id="bc-desc">A past experience writes a belief, the belief drives today's result. The History Change Method breaks the chain between the past experience and the belief.</desc>
  <rect x="10" y="10" width="740" height="230" rx="18" fill="#fefdfb" stroke="#e7ddd0" stroke-width="1.5"/>
  <!-- node 1 -->
  <rect x="44" y="86" width="180" height="70" rx="12" fill="#f3ece1" stroke="#cbbda9" stroke-width="1.5"/>
  <text x="134" y="116" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1c1a18">Past experience</text>
  <text x="134" y="136" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="12" fill="#8a7f6f">an old setback or hurt</text>
  <!-- arrow 1 (break point) -->
  <line x1="232" y1="121" x2="288" y2="121" stroke="#cbbda9" stroke-width="2.5"/>
  <polygon points="288,121 280,116 280,126" fill="#cbbda9"/>
  <!-- node 2 -->
  <rect x="296" y="86" width="180" height="70" rx="12" fill="#f3ece1" stroke="#cbbda9" stroke-width="1.5"/>
  <text x="386" y="116" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1c1a18">The belief</text>
  <text x="386" y="136" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="12" fill="#8a7f6f">"people like me don't…"</text>
  <!-- arrow 2 -->
  <line x1="484" y1="121" x2="540" y2="121" stroke="#cbbda9" stroke-width="2.5"/>
  <polygon points="540,121 532,116 532,126" fill="#cbbda9"/>
  <!-- node 3 -->
  <rect x="548" y="86" width="168" height="70" rx="12" fill="#c9a227"/>
  <text x="632" y="116" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1c1a18">Today's result</text>
  <text x="632" y="136" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="12" fill="#5a4f3f">you don't act</text>
  <!-- break marker on arrow 1 -->
  <line x1="260" y1="104" x2="260" y2="138" stroke="#1c1a18" stroke-width="2.5" stroke-dasharray="3 4"/>
  <text x="260" y="74" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#a8851a">BREAK HERE</text>
  <text x="380" y="196" text-anchor="middle" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#1c1a18">The History Change Method reworks the experience, so it stops writing the belief.</text>
  <text x="730" y="226" text-anchor="end" font-family="Montserrat, 'Segoe UI', sans-serif" font-size="11" fill="#b8ad9d">smoothgoals.com</text>
</svg>
